server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache largo para assets versionados (Vite genera nombres con hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback para artifacts opcionales desplegados bajo subruta
    location /vera-pitch-deck/ {
        try_files $uri $uri/ /vera-pitch-deck/index.html;
    }

    location /vera-video-explainer/ {
        try_files $uri $uri/ /vera-video-explainer/index.html;
    }

    # Proxy para la API (Túnel invisible)
    location /api/ {
        proxy_pass https://vera-api-563736187554.europe-west1.run.app/api/;
        proxy_set_header Host vera-api-563736187554.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Importante para que Clerk y las cookies funcionen
        proxy_pass_request_headers on;
    }

    # SPA fallback: cualquier ruta que no exista cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin cache para el HTML para que los deploys nuevos se vean al instante
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}

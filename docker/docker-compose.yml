# =============================================================================
# Vera Hiring Tracker — docker-compose para producción
#
# Uso (desde el directorio docker/):
#   cp .env.example .env       # editar con valores reales
#   docker compose up -d --build
#
# Servicios:
#   - db    : PostgreSQL 16
#   - api   : backend Express (Node 24)
#   - web   : frontend React (estáticos servidos por nginx)
#   - proxy : Caddy (reverse proxy con HTTPS automático)
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-vera_hiring}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vera} -d ${POSTGRES_DB:-vera_hiring}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vera_hiring}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Define CLERK_SECRET_KEY en .env}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Define VITE_CLERK_PUBLISHABLE_KEY en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Notificaciones email (opcional)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_FROM_EMAIL: ${NOTIFY_FROM_EMAIL:-hiring@vera.example.com}
      # Análisis de CV (opcional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      CV_STORAGE_PROVIDER: ${CV_STORAGE_PROVIDER:-local}
      LOCAL_CV_STORAGE_DIR: ${LOCAL_CV_STORAGE_DIR:-/app/uploads}
      # Allowlist desde Google Sheets fallará silenciosamente sin Replit;
      # el código cae al CSV automáticamente.
      ALLOWED_EMAILS_SHEET_ID: ${ALLOWED_EMAILS_SHEET_ID:-}
      ALLOWED_EMAILS_SHEET_NAME: ${ALLOWED_EMAILS_SHEET_NAME:-lista de alumnos}
      ALLOWED_EMAILS_COLUMN_HEADER: ${ALLOWED_EMAILS_COLUMN_HEADER:-email}
    volumes:
      # CSV con la lista de emails permitidos. Edítalo en el host y la app
      # lo recargará al llamar a POST /api/access/reload o al reiniciar.
      - ./allowed-emails.csv:/app/artifacts/api-server/data/allowed-emails.csv:ro
      # Almacén local para CVs subidos (alternativa a Object Storage)
      - cv-uploads:/app/uploads

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        # Vite hornea esta variable en el bundle en build time.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Define VITE_CLERK_PUBLISHABLE_KEY en .env}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Define DOMAIN en .env (ej: vera.tudominio.com)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  db-data:
  cv-uploads:
  caddy-data:
  caddy-config:
